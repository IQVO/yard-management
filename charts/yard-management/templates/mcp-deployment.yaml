{{- if .Values.mcp.enabled }}
{{- include "yard-management.requireDatabase" . -}}
{{- include "yard-management.requireKafka" . -}}
{{- include "yard-management.requireNoInMemoryEnv" (dict "list" .Values.mcp.extraEnv "where" "mcp.extraEnv") -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "yard-management.mcpFullname" . }}
  labels:
    {{- include "yard-management.labels" . | nindent 4 }}
    app.kubernetes.io/component: mcp
spec:
  replicas: {{ .Values.mcp.replicaCount }}
  selector:
    matchLabels:
      {{- include "yard-management.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: mcp
  template:
    metadata:
      labels:
        {{- include "yard-management.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: mcp
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "yard-management.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: mcp
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: {{ include "yard-management.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/app/mcp"]
          ports:
            - name: http
              containerPort: {{ .Values.mcp.service.targetPort }}
              protocol: TCP
          # Env contract verified against cmd/mcp/config.go: MCP_ADDR,
          # LOG_LEVEL, SHUTDOWN_DRAIN_DELAY, DATABASE_URL and KAFKA_BROKERS
          # (both required), plus MIGRATIONS_DATABASE_URL for the migration
          # step (cmd/mcp migrates on start like the api). cmd/mcp has no auth
          # env, starts no outbox relay and runs no consumer: its writes
          # enqueue outbox rows that the relay component drains, and Kafka is
          # needed for the boot check and /readyz only.
          env:
            - name: MCP_ADDR
              value: {{ .Values.mcp.httpAddr | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.config.logLevel | quote }}
            {{- with .Values.config.shutdownDrainDelay }}
            - name: SHUTDOWN_DRAIN_DELAY
              value: {{ . | quote }}
            {{- end }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "yard-management.databaseSecretName" . }}
                  key: {{ .Values.database.existingSecretKey }}
            {{- if .Values.database.migrationsExistingSecretKey }}
            # cmd/mcp runs the idempotent embedded migrations on start (like
            # the api), so it needs the same direct-connection split.
            - name: MIGRATIONS_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "yard-management.databaseSecretName" . }}
                  key: {{ .Values.database.migrationsExistingSecretKey }}
                  optional: true
            {{- end }}
            - name: KAFKA_BROKERS
              value: {{ .Values.kafka.brokers | quote }}
            {{- range .Values.mcp.extraEnv }}
            - {{ toYaml . | nindent 14 | trim }}
            {{- end }}
          # GET /healthz and /readyz are served by cmd/mcp.
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            {{- toYaml .Values.mcp.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
