{{- if and .Values.analytics.enabled .Values.analytics.reports.route.enabled -}}
{{- /*
Analytics reports exposure through Kong (fleet decision 2026-10-13: Kong
config lives in the application charts, not warehouse-infra Terraform).

Host contract: /api/yard-management/reports -> Service <release>-reports:80,
prefix rewritten to /reports (cmd/yard-reports registers GET
/reports/<report-name>, not a bare /<name>).
*/ -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "yard-management.analyticsReportsFullname" . }}
  labels:
    {{- include "yard-management.labels" . | nindent 4 }}
    app.kubernetes.io/component: analytics-reports
  annotations:
    konghq.com/plugins: {{ include "yard-management.kongPluginNames" . | quote }}
spec:
  parentRefs:
    {{- range .Values.analytics.reports.route.parentRefs }}
    - name: {{ .name }}
      namespace: {{ .namespace }}
      {{- if .sectionName }}
      sectionName: {{ .sectionName }}
      {{- end }}
    {{- end }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: {{ .Values.analytics.reports.route.path }}
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /reports
      backendRefs:
        - name: {{ include "yard-management.analyticsReportsFullname" . }}
          port: {{ .Values.analytics.reports.service.port }}
{{- end }}
