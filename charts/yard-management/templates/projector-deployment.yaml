{{- if .Values.analytics.enabled }}
{{- include "yard-management.requireKafka" . -}}
{{- include "yard-management.requireAnalyticsConfig" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "yard-management.analyticsProjectorFullname" . }}
  labels:
    {{- include "yard-management.labels" . | nindent 4 }}
    app.kubernetes.io/component: analytics-projector
spec:
  replicas: {{ .Values.analytics.projector.replicaCount }}
  selector:
    matchLabels:
      {{- include "yard-management.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: analytics-projector
  template:
    metadata:
      labels:
        {{- include "yard-management.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: analytics-projector
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "yard-management.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: projector
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: {{ include "yard-management.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/app/yard-projector"]
          ports:
            - name: http
              containerPort: {{ .Values.analytics.projector.adminPort }}
              protocol: TCP
          # Env contract verified against cmd/yard-projector/main.go:
          # ANALYTICS_DATABASE_URL (required, direct DSN -- the projector
          # never opens the OLTP database), KAFKA_BROKERS (required),
          # ANALYTICS_CONSUMER_GROUP (required, stable group so a
          # rescheduled pod resumes from committed offsets), ADMIN_ADDR and
          # LOG_LEVEL. It reads no OLTP env: no DATABASE_URL, no consumer
          # groups of the api.
          env:
            - name: ANALYTICS_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "yard-management.analyticsSecretName" . }}
                  key: {{ .Values.analytics.existingSecretKey }}
            - name: KAFKA_BROKERS
              value: {{ .Values.kafka.brokers | quote }}
            - name: ANALYTICS_CONSUMER_GROUP
              value: {{ .Values.analytics.consumerGroup | quote }}
            - name: ADMIN_ADDR
              value: {{ .Values.analytics.projector.adminAddr | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.config.logLevel | quote }}
            # Fleet observability standard (ADR 0017): ENVIRONMENT, SERVICE_VERSION and,
            # while otel.enabled, OTEL_EXPORTER_OTLP_ENDPOINT and OTEL_SERVICE_NAME.
            {{- include "yard-management.telemetryEnv" (dict "root" . "suffix" "projector") | nindent 12 }}
            {{- range .Values.analytics.projector.extraEnv }}
            - {{ toYaml . | nindent 14 | trim }}
            {{- end }}
          # /healthz (never flipped) and /readyz (flips to 503 as the first
          # step of shutdown) on the admin port.
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            {{- toYaml .Values.analytics.projector.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
