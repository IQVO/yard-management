{{- if and .Values.analytics.enabled (or .Values.analytics.url .Values.analytics.readerUrl) (not .Values.analytics.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "yard-management.analyticsSecretName" . }}
  labels:
    {{- include "yard-management.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- with .Values.analytics.url }}
  {{ $.Values.analytics.existingSecretKey }}: {{ . | quote }}
  {{- end }}
  {{- with .Values.analytics.readerUrl }}
  {{ $.Values.analytics.readerExistingSecretKey }}: {{ . | quote }}
  {{- end }}
{{- end }}
