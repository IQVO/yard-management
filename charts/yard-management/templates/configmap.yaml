# Non-secret configuration of the api component, mirrored from the env the
# Deployment renders and mounted into the api container with envFrom (the
# explicit env entries win for the same key); the Deployment's
# checksum/config annotation rolls the pods whenever any of it changes. Every
# key is a variable cmd/api reads (tests/render_test.sh). No DSN ever lands
# here (DATABASE_URL, MIGRATIONS_DATABASE_URL and ANALYTICS_READER_DATABASE_URL
# live in a Secret: templates/secret.yaml, analytics-secret.yaml or the
# existing secrets).
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "yard-management.fullname" . }}
  labels:
    {{- include "yard-management.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
data:
  HTTP_ADDR: {{ .Values.config.httpAddr | quote }}
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  KAFKA_BROKERS: {{ .Values.kafka.brokers | quote }}
  DOCK_SCHEDULING_CONSUMER_GROUP: {{ .Values.config.dockSchedulingConsumerGroup | quote }}
  FACILITY_CONSUMER_GROUP: {{ .Values.config.facilityConsumerGroup | quote }}
  INBOUND_RECEIVING_CONSUMER_GROUP: {{ .Values.config.inboundReceivingConsumerGroup | quote }}
  {{- with .Values.config.shutdownDrainDelay }}
  SHUTDOWN_DRAIN_DELAY: {{ . | quote }}
  {{- end }}
